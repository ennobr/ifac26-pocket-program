<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IFAC 2026">
  <meta name="description" content="A fast, offline-friendly pocket program for IFAC World Congress 2026.">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>IFAC 2026 Pocket Program</title>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="eyebrow">BUSAN · 24–28 AUGUST</div>
      <h1>IFAC 2026</h1>
    </div>
    <button id="syncBtn" class="sync-button" type="button" aria-label="Check for a program update">
      <span aria-hidden="true">↻</span>
      <span class="sync-label">Update</span>
    </button>
  </header>

  <main>
    <section id="loadingState" class="loading-state" aria-live="polite">
      <div class="loading-mark" aria-hidden="true"></div>
      <h2>Opening the program…</h2>
      <p>The complete schedule is stored with the app for fast, offline access.</p>
    </section>

    <div id="app" hidden>
      <section id="overview" class="overview-card" aria-labelledby="overviewTitle">
        <div>
          <div id="overviewKicker" class="overview-kicker"></div>
          <h2 id="overviewTitle"></h2>
          <p id="overviewText"></p>
        </div>
        <button id="overviewSaved" class="saved-summary" type="button">
          <span id="savedCount">0</span>
          <span>saved</span>
        </button>
      </section>

      <div id="dayTabs" class="day-tabs" role="tablist" aria-label="Program day"></div>

      <section id="exploreControls" class="explore-controls" hidden>
        <label class="search-field">
          <span class="visually-hidden">Search the program</span>
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search sessions, papers, authors or rooms" autocomplete="off">
        </label>
        <div id="typeFilters" class="type-filters" aria-label="Filter by session type"></div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="content" class="content" aria-live="polite"></section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button type="button" data-view="schedule" class="active" aria-current="page">
      <span aria-hidden="true">◫</span><span>Schedule</span>
    </button>
    <button type="button" data-view="explore">
      <span aria-hidden="true">⌕</span><span>Explore</span>
    </button>
    <button type="button" data-view="agenda">
      <span aria-hidden="true">★</span><span>My program</span>
    </button>
    <button type="button" data-view="info">
      <span aria-hidden="true">i</span><span>Info</span>
    </button>
  </nav>

  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <div class="dialog-header">
      <div>
        <div id="detailKicker" class="detail-kicker"></div>
        <h2 id="detailTitle"></h2>
      </div>
      <button id="closeDialog" class="close-button" type="button" aria-label="Close session details">×</button>
    </div>
    <div id="detailContent"></div>
  </dialog>

  <script src="app.js?v=2"></script>
</body>
</html>
