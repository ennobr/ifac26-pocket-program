name: Update conference program

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-conference-program
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and validate PaperCept
        run: python scripts/build_program.py
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- data/program.json data/version.json; then
            echo "The published program has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/program.json data/version.json
          git commit -m "Update conference program"
          git push
